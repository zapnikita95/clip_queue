<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 12px; width: 280px; color: #111; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin: 8px 0 4px; color: #555; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ddd; border-radius: 8px; }
    button { margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #e85d4c; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #eee; color: #222; }
    .hint { font-size: 11px; color: #777; margin-top: 8px; }
    .ok { color: #0a7; margin-top: 8px; }
    .err { color: #c22; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Kyro</h1>
  <label>API (обычно не меняйте)</label>
  <input id="api" placeholder="https://clip-queue-web-production.up.railway.app" />
  <label>Токен сессии</label>
  <input id="token" placeholder="из кабинета Kyro → localStorage token" />
  <button id="save">Сохранить текущее видео</button>
  <button class="secondary" id="persist">Записать настройки</button>
  <div class="hint">Откройте Kyro в браузере, войдите через Google, в консоли: <code>localStorage.getItem('cq_session_token')</code> — вставьте сюда.</div>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
