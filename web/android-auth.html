<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clip Queue</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0b0b0d; color: #f2f2f4; padding: 24px; text-align: center;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 8px; }
    p { color: #8a8a96; margin: 0 0 20px; line-height: 1.4; }
    a.btn {
      display: inline-block; background: #ff3b30; color: #fff; text-decoration: none;
      padding: 14px 22px; border-radius: 12px; font-weight: 700;
    }
    .err { color: #ff7a45; }
  </style>
</head>
<body>
  <div>
    <h1 id="title">Открываю приложение…</h1>
    <p id="msg">Если не открылось — нажми кнопку ниже.</p>
    <a class="btn" id="open" href="#">Открыть Clip Queue</a>
    <p id="err" class="err" hidden></p>
  </div>
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      const token = q.get("token") || "";
      const autosync = q.get("autosync") || "0";
      const error = q.get("error") || "";
      const title = document.getElementById("title");
      const msg = document.getElementById("msg");
      const open = document.getElementById("open");
      const errEl = document.getElementById("err");

      if (error) {
        title.textContent = "Ошибка входа";
        errEl.hidden = false;
        errEl.textContent = error;
        open.href = "clipqueue://auth?error=" + encodeURIComponent(error);
        return;
      }
      if (!token) {
        title.textContent = "Нет токена";
        msg.textContent = "Вернись в приложение и войди снова.";
        open.href = "clipqueue://auth";
        return;
      }

      const deep = "clipqueue://auth?token=" + encodeURIComponent(token) + "&autosync=" + encodeURIComponent(autosync);
      const intent =
        "intent://auth?token=" + encodeURIComponent(token) +
        "&autosync=" + encodeURIComponent(autosync) +
        "#Intent;scheme=clipqueue;package=ru.clipqueue.app;end";

      open.href = deep;
      // Prefer Android intent URL when available
      const ua = navigator.userAgent || "";
      const target = /Android/i.test(ua) ? intent : deep;

      try { location.replace(target); } catch (_) {}
      setTimeout(function () {
        try { location.href = deep; } catch (_) {}
      }, 400);
    })();
  </script>
</body>
</html>
