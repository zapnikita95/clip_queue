<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clip Queue — design home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../web/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name">Clip Queue</div>
          <div class="brand-sub">design mock · сестра Movie Planner</div>
        </div>
      </div>
    </header>
    <section class="hero">
      <h1>Что посмотреть из своего</h1>
      <p>Панель интересов: очередь, каналы, вайб. Не лента YouTube.</p>
    </section>
    <section class="rail">
      <div class="rail-head"><h2>В очереди</h2></div>
      <div class="rail-track">
        <div class="card"><div class="card-thumb" style="background:#222"></div><div class="card-body"><h3 class="card-title">Пример сохранённого видео</h3><div class="card-meta">Канал</div></div></div>
        <div class="card"><div class="card-thumb" style="background:#333"></div><div class="card-body"><h3 class="card-title">Ещё одно из твоих интересов</h3><div class="card-meta">Канал</div></div></div>
      </div>
    </section>
  </div>
</body>
</html>
